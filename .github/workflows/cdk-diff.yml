name: CDK Synth

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            infra/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Bundle Lambda functions
        run: npm run build
        working-directory: backend

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Type-check infrastructure
        run: npm run build
        working-directory: infra

      # PR-controlled CDK code is synthesized without AWS credentials. A live
      # diff must only run from trusted code after merge to main.
      - name: Synthesize CloudFormation templates
        run: npx cdk synth --quiet
        working-directory: infra
