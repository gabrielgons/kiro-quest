name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment is what makes this job deployable: the AWS_* / GOOGLE_*
    # configuration is scoped to it, and the OIDC trust policy only accepts the
    # environment:production-infra subject and this exact workflow name on main.
    # The branch guard stays as defense in depth for workflow_dispatch.
    environment: production-infra
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Bundle Lambda functions
        run: npm run build
        working-directory: backend

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/KiroQuestInfraDeployRole
          role-session-name: GitHubActions-Infra-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Deploy stacks
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # The ARN identifies the secret but is not the secret value.
          GOOGLE_CLIENT_SECRET_ARN: ${{ vars.GOOGLE_CLIENT_SECRET_ARN }}
        run: >-
          npx cdk deploy
          KiroQuestGitHubOidcStack
          KiroQuestFrontendStack
          KiroQuestAuthStack
          KiroQuestBackendStack
          --require-approval never
        working-directory: infra
