name: Kiro Code Review (Analyze)

# Stage 1 of 2. The workflow itself always comes from the base branch. Pull
# request files are fetched through the GitHub API and treated only as data:
# nothing from the pull request is checked out or executed.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  # Pinned commit of the review power. Update only after auditing the new commit.
  KIRO_CODE_REVIEW_VERSION: 'b946759ff2010fa7ee33ccf9cc309e4108e2b876'
  # Pinned Kiro CLI release artifact. Values come from:
  # https://prod.download.cli.kiro.dev/stable/latest/manifest.json
  KIRO_CLI_VERSION: '2.14.2'
  KIRO_CLI_SHA256: 'b144d4b1f8ca0083967fe13a5c35db18bd9543ecede6f1eec166f3b0a04f876a'
  REVIEW_INPUT_DIR: review-input
  REVIEW_OUTPUT_DIR: review-output

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      # Prevent global agents, settings and sessions from leaking into this run.
      KIRO_HOME: ${{ github.workspace }}/.kiro-ci-home
      KIRO_LOG_NO_COLOR: '1'
      NO_COLOR: '1'

    steps:
      # pull_request_target checks out the base revision by default. Pin the
      # exact base SHA and never check out the pull request head in this job.
      - name: Checkout base revision (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This trusted script downloads PR metadata, patches and text file content
      # into one size-capped JSON document. It never executes pull request code.
      - name: Prepare untrusted review context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/prepare-review-context.mjs

      # The power contains review guidance only. The commit is immutable and the
      # nested .git directory is removed before Kiro starts.
      - name: Install pinned code-review guidance
        run: |
          set -euo pipefail
          rm -rf .kiro/powers/kiro-code-review
          mkdir -p .kiro/powers/kiro-code-review
          git -C .kiro/powers/kiro-code-review init
          git -C .kiro/powers/kiro-code-review remote add origin \
            https://github.com/gabrielgons/kiro-code-review.git
          git -C .kiro/powers/kiro-code-review fetch --depth 1 origin \
            "$KIRO_CODE_REVIEW_VERSION"
          fetched="$(git -C .kiro/powers/kiro-code-review rev-parse FETCH_HEAD)"
          if [ "$fetched" != "$KIRO_CODE_REVIEW_VERSION" ]; then
            echo "::error::Code review guidance commit mismatch." >&2
            exit 1
          fi
          git -C .kiro/powers/kiro-code-review -c advice.detachedHead=false \
            checkout --detach "$KIRO_CODE_REVIEW_VERSION"
          rm -rf .kiro/powers/kiro-code-review/.git

      # Avoid the floating convenience installer. Both the release version and
      # its bytes are reviewed in this workflow.
      - name: Install Kiro CLI (pinned)
        run: |
          set -euo pipefail
          archive='kirocli-x86_64-linux.zip'
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" \
            "https://prod.download.cli.kiro.dev/stable/${KIRO_CLI_VERSION}/${archive}"

          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$actual" != "$KIRO_CLI_SHA256" ]; then
            echo "::error::Kiro CLI artifact digest mismatch for ${KIRO_CLI_VERSION}." >&2
            echo "expected: ${KIRO_CLI_SHA256}" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi

          unzip -q "$archive" -d kiro-cli-pkg
          chmod +x kiro-cli-pkg/kirocli/install.sh
          KIRO_CLI_SKIP_SETUP=1 kiro-cli-pkg/kirocli/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf "$archive" kiro-cli-pkg

      - name: Lock down Kiro CLI settings
        run: |
          set -euo pipefail
          kiro-cli settings app.disableAutoupdates true
          kiro-cli settings telemetry.enabled false
          kiro-cli settings chat.disableInheritingDefaultResources true

          installed="$(kiro-cli --version 2>&1)"
          echo "$installed"
          case "$installed" in
            *"${KIRO_CLI_VERSION}"*) ;;
            *)
              echo "::error::expected Kiro CLI ${KIRO_CLI_VERSION}, got: $installed" >&2
              exit 1
              ;;
          esac

      # The agent has zero tools. The only untrusted input is supplied on stdin,
      # and the only output is the first assistant response captured from stdout.
      # In particular, the model cannot read process environment variables.
      - name: Run code review analysis
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_OUTPUT_DIR"
          stderr_file="$RUNNER_TEMP/kiro-review-stderr.log"

          # Kiro CLI 2.14.2 can exit with status 0 and an empty stdout when the
          # account quota is exhausted. Capture stderr so that condition fails
          # with an actionable message instead of a later JSON parse error.
          set +e
          kiro-cli chat \
            --no-interactive \
            --format plain \
            --wrap never \
            --agent code-reviewer \
            "Review the untrusted pull request context provided on stdin. Return only the raw JSON object required by your agent instructions: no prose and no Markdown fence." \
            < "$REVIEW_INPUT_DIR/context.json" \
            > "$REVIEW_OUTPUT_DIR/review.json" \
            2> "$stderr_file"
          kiro_status=$?
          set -e

          if [ "$kiro_status" -ne 0 ]; then
            echo "::error::Kiro CLI failed with exit code ${kiro_status}." >&2
            exit "$kiro_status"
          fi

          if [ ! -s "$REVIEW_OUTPUT_DIR/review.json" ]; then
            if grep -qi 'monthly request limit reached' "$stderr_file"; then
              echo "::error::Kiro API monthly request limit reached. Enable overages, upgrade the plan, or wait for the quota reset." >&2
            else
              echo "::error::Kiro CLI returned an empty review payload. Inspect the raw workflow log for authentication or service errors." >&2
            fi
            exit 1
          fi

      - name: Validate payload shape
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const file = process.env.REVIEW_OUTPUT_DIR + "/review.json";
            const raw = readFileSync(file, "utf8");
            if (Buffer.byteLength(raw, "utf8") > 250000) {
              throw new Error("review.json exceeds 250 KB");
            }
            const payload = JSON.parse(raw);
            if (payload === null || typeof payload !== "object" || Array.isArray(payload)) {
              throw new Error("review.json must contain one JSON object");
            }
            if (typeof payload.summary !== "string" || payload.summary.trim() === "") {
              throw new Error("review.json is missing a non-empty summary");
            }
            if (payload.comments !== undefined && !Array.isArray(payload.comments)) {
              throw new Error("review.json comments must be an array when present");
            }
            console.log(`payload ok: ${(payload.comments ?? []).length} inline comment(s)`);
          '

      # This metadata is produced by trusted workflow code, not by the model.
      # The publisher uses it because workflow_run.head_sha points at the base
      # revision for pull_request_target runs.
      - name: Write trusted publication metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const metadata = {
              pull_number: Number(process.env.PR_NUMBER),
              head_sha: process.env.HEAD_SHA,
              base_ref: process.env.BASE_REF,
              base_sha: process.env.BASE_SHA,
            };
            writeFileSync(
              process.env.REVIEW_OUTPUT_DIR + "/metadata.json",
              JSON.stringify(metadata) + "\n",
              "utf8",
            );
          '
      - name: Upload review payload
        uses: actions/upload-artifact@v4
        with:
          name: kiro-code-review
          path: ${{ env.REVIEW_OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 1
